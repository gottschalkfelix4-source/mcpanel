# nginx im Alles-in-einem-Abbild: liefert die Oberflaeche aus und reicht
# /api sowie /socket.io an das Backend im selben Container weiter.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 4G;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        # Statische Assets lange cachen, index.html nie
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Service Worker darf nie aus dem Cache kommen, sonst hängen Updates fest
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /manifest.webmanifest {
            types { } default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

}
