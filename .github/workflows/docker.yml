name: Abbild bauen

# Baut das Alles-in-einem-Abbild und legt es in der GitHub-Registry ab.
# Genau dieses Abbild zieht das Unraid-Template.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Laeuft vor dem Bau: der Docker-Bau prueft zwar die Typen mit, kennt aber
  # keine Tests - ein Logikfehler kaeme sonst bis nach :latest durch.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npx prisma generate
        working-directory: backend

      - run: npx tsc -p tsconfig.json
        working-directory: backend

      - run: node --input-type=module -e "await import('./dist/services/sftp.js'); console.log('SFTP-Modul geladen');"
        working-directory: backend
        env:
          JWT_SECRET: mcpanel-laufzeitpruefung-ohne-produktivzugriff

      - run: npm test
        working-directory: backend
        env:
          AUDIT_SFTP_TESTS: '1'

      # Bekannte Lücken in Abhängigkeiten sichtbar machen, ohne den Bau zu
      # blockieren - nicht jede Meldung betrifft den tatsächlich genutzten Code.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
        continue-on-error: true

  # Die Oberfläche wurde bisher erst im Docker-Bau geprüft: ein Typfehler
  # fiel damit erst nach den Backend-Tests auf und brach dann den Bau ab.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
        continue-on-error: true

  # Das fertige Abbild einmal wirklich starten, bevor es nach :latest oder
  # unter einer Versionsnummer veroeffentlicht wird: frische Datenbank,
  # Einrichtung mit Code, Konten, Server, Backups, Welten, Sitzungen,
  # zweiter Faktor. Faengt alles, was Unit-Tests mit Mocks nicht sehen
  # (Schemaabgleich, nginx, Startskript, echte Archive).
  e2e:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mcpanel:e2e
          build-args: |
            VERSION=e2e
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          # Derselbe Cache wie im Veroeffentlichungsjob - der baut danach
          # praktisch nichts mehr neu.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Panel starten
        run: |
          docker volume create mcpanel-e2e-data
          docker run -d --name mcpanel-e2e -p 18089:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v mcpanel-e2e-data:/data \
            mcpanel:e2e
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:18089/api/health >/dev/null 2>&1; then echo "Panel bereit nach ${i}x2 s"; exit 0; fi
            sleep 2
          done
          echo "Panel wurde nicht gesund"
          docker logs mcpanel-e2e
          exit 1

      - name: End-zu-End-Test
        run: |
          for i in $(seq 1 15); do
            CODE=$(docker exec mcpanel-e2e cat /data/.setup-code 2>/dev/null || true)
            [ -n "$CODE" ] && break
            sleep 2
          done
          if [ -z "$CODE" ]; then echo "Kein Einrichtungscode gefunden"; exit 1; fi
          E2E_BASE=http://localhost:18089 E2E_SETUP_CODE="$CODE" node scripts/e2e.mjs

      - name: Protokoll bei Fehlschlag
        if: failure()
        run: docker logs mcpanel-e2e 2>&1 | tail -300

      - name: Aufraeumen
        if: always()
        run: |
          docker ps -aq --filter "name=^mc-" | xargs -r docker rm -f
          docker rm -f mcpanel-e2e || true
          docker volume rm mcpanel-e2e-data || true

  build:
    needs: [test, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=MCPanel
            org.opencontainers.image.description=Minecraft-Server-Hosting-Panel mit Modpack-Installer
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # oci-mediatypes=false: buildx wuerde sonst ein Manifest in
          # OCI-Medientypen ablegen. Das laesst sich nur abrufen, wenn der
          # Client die OCI-Typen im Accept-Kopf mitschickt - Docker tut das,
          # Unraids Update-Pruefung fragt aber nur nach den Docker-Typen und
          # bekommt dann 404. In der Oberflaeche steht dann
          # "Update-Status: nicht verfuegbar".
          outputs: type=registry,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # Ohne diese beiden Zeilen legt buildx neben dem Abbild ein
          # Attestation-Manifest ab, und das Ergebnis ist ein Index mit einem
          # zweiten Eintrag "unknown/unknown". Unraid vergleicht zur
          # Update-Erkennung Digests und kommt damit durcheinander - der
          # Knopf "update ready" bleibt dann dauerhaft stehen.
          provenance: false
          sbom: false
          # amd64 reicht fuer Unraid und die uebliche NAS-Hardware. arm64 waere
          # per QEMU zwar moeglich, verdreifacht aber die Bauzeit.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
